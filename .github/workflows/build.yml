name: Build LiteMonitor

on:
  push:
    branches:
      - master
    tags:
      - 'v*'  # 版本号标记
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    name: Check release tag
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.gate.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether the build is needed
        id: gate
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "标签事件，执行构建并发布 Release。"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "${{ github.event_name }} 事件，执行构建。"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            tags=$(git tag --points-at "${{ github.sha }}" --list 'v*')
            if [ -n "$tags" ]; then
              echo "提交 ${{ github.sha }} 已被版本标签 $tags 指向，跳过分支重复构建。"
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            else
              echo "分支推送且无版本标签，执行构建。"
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    name: Build Windows x64
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore LiteMonitor.csproj --runtime win-x64

      - name: Validate plugin JSON files
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path 'resources/plugins' -Filter '*.json'
          if ($files.Count -eq 0) {
            throw 'No plugin JSON files were found.'
          }

          foreach ($file in $files) {
            try {
              Get-Content -Raw -LiteralPath $file.FullName | ConvertFrom-Json | Out-Null
              Write-Host "Validated $($file.Name)"
            }
            catch {
              throw "Invalid JSON in $($file.FullName): $($_.Exception.Message)"
            }
          }

      - name: Build
        run: dotnet build LiteMonitor.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Publish Windows x64
        run: >-
          dotnet publish LiteMonitor.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output publish
          --no-restore

      - name: Create release archive
        shell: pwsh
        run: |
          $version = ''
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -match '^v(.+)$') {
            $version = $Matches[1]
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            [xml]$project = Get-Content -Raw -LiteralPath 'LiteMonitor.csproj'
            $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
          }
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = '${{ github.sha }}'
          }

          $archive = "LiteMonitor-win-x64-$version.zip"
          Compress-Archive -Path 'publish\*' -DestinationPath $archive -Force
          "ARCHIVE=$archive" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: LiteMonitor-win-x64-${{ github.sha }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish release to GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ARCHIVE }}
          name: LiteMonitor ${{ github.ref_name }}
          body: |
            下载 `LiteMonitor-win-x64-<版本>.zip`，解压后运行 LiteMonitor.exe。
            本版本为框架依赖发布，需要预先安装 [.NET 8 Desktop Runtime (x64)](https://dotnet.microsoft.com/get-dotnet/dotnet-core?missing_runtime=true&arch=x64&rid=win-x64&os=win7&apphost_version=8.0.0&gui=true) 。
          fail_on_unmatched_files: true
